[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "A statistically honest evaluation harness for non-deterministic LLM agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rohan Disa" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[project.scripts]
aeh = "aeh.cli:app"

[project.entry-points."aeh.suites"]
customer_support = "suites.customer_support.suite:CustomerSupportSuite"
toy_math = "suites.toy_math.suite:ToyMathSuite"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aeh*", "suites*"]

[tool.setuptools.package-data]
aeh = ["report/templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "local_http: needs the local fixture HTTP server (still no public network)",
    "network: opt out of the httpx send block",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["aeh"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "suites"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
