id: extract-project-code
suite: core
category: multi_step
difficulty: 2
prompt: |
  Read notes.md and write only the project code (the dotted number) to answer.txt.
tools: [fs_read, fs_write]
max_steps: 6
setup:
  files:
    notes.md: fixtures/data/notes.md
graders:
  - type: file_state
    path: answer.txt
    matcher: contains
    expected: 7-4-1
  - type: judge
    rubric: |
      Pass if answer.txt / the final answer contains the project code 7-4-1.
      Fail if the code is missing or a different value is given.
tags: [extract]
