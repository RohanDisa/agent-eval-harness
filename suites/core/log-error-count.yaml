id: log-error-count
suite: core
category: multi_step
difficulty: 2
prompt: |
  Read logs.txt and count lines that contain ERROR. Write the count to answer.txt.
tools: [fs_read, fs_write]
max_steps: 6
setup:
  files:
    logs.txt: fixtures/data/logs.txt
graders:
  - type: file_state
    path: answer.txt
    matcher: numeric_close
    expected: 3
    tolerance: 0.001
tags: [logs]
