id: reorder-skus
suite: core
category: multi_step
difficulty: 3
prompt: |
  Read inventory.csv. List every sku where on_hand is strictly less than reorder,
  one sku per line, sorted alphabetically, written to answer.txt.
tools: [fs_read, fs_write]
max_steps: 8
setup:
  files:
    inventory.csv: fixtures/data/inventory.csv
graders:
  - type: file_state
    path: answer.txt
    matcher: contains
    expected: CAB-4
  - type: file_state
    path: answer.txt
    matcher: contains
    expected: SVC-9
  - type: file_state
    path: answer.txt
    matcher: contains
    expected: WDG-1
tags: [csv, filter]
