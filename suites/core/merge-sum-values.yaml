id: merge-sum-values
suite: core
category: multi_step
difficulty: 3
prompt: |
  Read a.csv and b.csv. Sum every value column across both files.
  Write the total as a number to answer.txt.
tools: [fs_read, fs_write, calculator]
max_steps: 10
setup:
  files:
    a.csv: fixtures/data/merge_a.csv
    b.csv: fixtures/data/merge_b.csv
graders:
  - type: file_state
    path: answer.txt
    matcher: numeric_close
    expected: 81
    tolerance: 0.01
tags: [csv, merge]
