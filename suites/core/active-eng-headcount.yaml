id: active-eng-headcount
suite: core
category: multi_step
difficulty: 2
prompt: |
  Read employees.csv. Count how many rows have dept=eng and active=true.
  Write that integer to answer.txt.
tools: [fs_read, fs_write]
max_steps: 8
setup:
  files:
    employees.csv: fixtures/data/employees.csv
graders:
  - type: file_state
    path: answer.txt
    matcher: numeric_close
    expected: 3
    tolerance: 0.001
tags: [csv, filter]
