id: gold-emea-customers
suite: core
category: multi_step
difficulty: 3
prompt: |
  Using sql, count gold-tier customers in the EMEA region (regions.name = 'EMEA').
  Write the integer to answer.txt.
tools: [sql, fs_write]
max_steps: 8
graders:
  - type: file_state
    path: answer.txt
    matcher: numeric_close
    expected: 1
    tolerance: 0.001
tags: [sql, multi_step]
